# Add (or update) entries in After-Effect-HUB.json — ONE ENTRY PER .ZIP ASSET.
#
# ONE FILE. No Python. No external script. Everything runs inline in bash + jq.
#
# MANUAL ONLY — never runs automatically. No `on: release`, no `on: push`,
# no `schedule`. You trigger it yourself from the Actions tab after uploading
# assets to a release.
#
# HOW TO USE:
#   1. Upload one or more .zip assets to a release in your repo.
#   2. Actions tab → "Add HUB Entry" → Run workflow.
#   3. In the `release_tag` box, type ANY of:
#        - nothing (empty) -> uses the latest published release.
#        - the exact tag            (e.g. `standalone`)
#        - the exact release name   (e.g. `Adobe-Pluginsexe`)
#        - a substring that matches only ONE release (case-insensitive,
#          matched against both tag and name — e.g. `adobe` if it's unique)
#   4. Workflow downloads every .zip asset, scans each for .exe, and adds
#      ONE entry PER .zip into After-Effect-HUB.json, then commits.
#
# WHY ONE ENTRY PER .ZIP (not per release):
#   A single release often ships several plugins (e.g. Saber.zip, Topaz.zip,
#   AI_Color_Match_Pro.zip all under the "standalone" tag). Each .zip is its
#   own installable plugin, so it gets its own entry. The entry's `name` is
#   derived from the .zip filename (e.g. "Saber_1.0.40.zip" → "Saber"), NOT
#   the release title — so all assets under one release get distinct names.
#
# NAME BEAUTIFICATION (from the .zip filename):
#   AI_Color_Match_Pro_v1.6.18.zip  -> name="AI Color Match Pro"  version="1.6.18"
#   Saber_1.0.40.zip                -> name="Saber"               version="1.0.40"
#   Topaz.Video.AI.Pro-7.1.6.zip    -> name="Topaz Video AI Pro"  version="7.1.6"
#   - Trailing version (with/without v) is stripped from the name.
#   - Underscores/dots/dashes become spaces, collapsed and trimmed.
#   - The version is the trailing numeric run.
#
# DEDUP / UPDATE POLICY (so re-runs don't duplicate and don't clobber edits):
#   An existing entry is matched by ID (case-insensitive) OR by `link`
#   (the asset's browser_download_url — stable across name edits).
#   - Match found  -> UPDATE technical fields only: type, activator, sha256,
#                    size_bytes, link, version (if filename version present),
#                    last_updated, updatedAt. PRESERVES any hand-edited
#                    name / plugin_type / description / tags / category.
#   - No match     -> APPEND a new entry with beautified name + computed fields.
#   - The `name` you type into the release title is NOT used — only the
#     .zip filenames. So you can freely rename entries in the JSON later
#     without the workflow clobbering your edits.
#
# DETECTION:
#   Each .zip is unzipped and recursively scanned for any .exe.
#     .exe found        -> type = "Standalone", plus activator=true if
#                          activator.exe is anywhere inside the zip.
#     no .exe found     -> type = "Plugin".
name: Add HUB Entry

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag OR name (or partial) of the release to scan — leave EMPTY for latest"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: add-hub-entry
  cancel-in-progress: false

jobs:
  add-entry:
    runs-on: ubuntu-latest
    steps:
      # ---------- 1. Checkout (full history so we can commit back) ----------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- 2. Resolve the release (DYNAMIC) ----------
      # The `release_tag` input can be any of:
      #   (a) EMPTY                  -> use the latest published release.
      #   (b) an exact tag            -> use it directly.
      #   (c) an exact release name   -> use that release's tag.
      #   (d) a unique substring of a tag OR name (case-insensitive)
      #                                -> use the single match's tag.
      # If nothing matches, OR if the substring matches more than one release,
      # list every release in the repo and stop.
      - name: Resolve release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail

          # Fetch every published release (up to 100) once, as JSON.
          # `gh release list` returns newest first.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,name > /tmp/all-releases.json

          REL_COUNT="$(jq 'length' /tmp/all-releases.json)"
          if [ "$REL_COUNT" -eq 0 ]; then
            echo "::error::This repo has NO published releases. Upload a release first, then re-run."
            exit 1
          fi

          if [ -z "${INPUT_TAG// /}" ]; then
            # (a) EMPTY -> latest.
            TAG="$(jq -r '.[0].tagName' /tmp/all-releases.json)"
            echo ">> No release_tag given — using the latest published release."
            echo ">> Latest release tag: $TAG"
          else
            QUERY="$(echo -n "$INPUT_TAG" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            echo ">> Resolving input '$QUERY' ..."

            # (b) exact tag match (case-sensitive).
            EXACT_TAG_HIT="$(jq -r --arg q "$QUERY" \
              'first(.[].tagName | select(. == $q)) // empty' /tmp/all-releases.json)"

            # (c) exact release-name match (case-sensitive).
            EXACT_NAME_HIT="$(jq -r --arg q "$QUERY" \
              'first(.[] | select(.name == $q) | .tagName) // empty' /tmp/all-releases.json)"

            # (d) unique substring (case-insensitive) of tagName OR name.
            # We collect every match, then take the tag only if exactly one.
            SUBSTR_HITS="$(jq -r --arg q "$QUERY" \
              '[.[] | select((.tagName | ascii_downcase | contains($q | ascii_downcase)) or (.name | ascii_downcase | contains($q | ascii_downcase))) | .tagName] | unique' \
              /tmp/all-releases.json)"

            if [ -n "$EXACT_TAG_HIT" ]; then
              TAG="$EXACT_TAG_HIT"
              echo ">> Matched by exact tag: $TAG"
            elif [ -n "$EXACT_NAME_HIT" ]; then
              TAG="$EXACT_NAME_HIT"
              echo ">> Matched by exact release name: $TAG"
            elif [ "$(echo "$SUBSTR_HITS" | jq 'length')" -eq 1 ]; then
              TAG="$(echo "$SUBSTR_HITS" | jq -r '.[0]')"
              echo ">> Matched by unique substring: $TAG"
            else
              echo "::error::Could not resolve '$QUERY' to a single release."
              echo "Substring matches found: $(echo "$SUBSTR_HITS" | jq -r 'length')"
              echo "$SUBSTR_HITS" | jq -r '.[] | "  - " + .' 2>/dev/null || true
              echo ""
              echo "----- all releases in this repo -----"
              jq -r '.[] | "  - " + .tagName + "  (" + .name + ")"' /tmp/all-releases.json
              echo "-------------------------------------"
              echo "Re-run with an exact tag, an exact name, or a substring that matches only ONE release."
              echo "Or leave the input empty to use the latest release."
              exit 1
            fi
          fi

          # Re-fetch the resolved release's full JSON.
          # NOTE: gh's asset objects use the field `url` for the browser
          # download URL — NOT `browser_download_url`.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,tagName,assets,url >/tmp/rel.json

          REL_TAG="$(jq -r '.tagName' /tmp/rel.json)"
          REL_NAME="$(jq -r '.name // empty' /tmp/rel.json)"
          echo ">> Resolved tag:    $REL_TAG"
          echo ">> Release name:    ${REL_NAME:-<untitled>}"
          echo ">> Asset count:     $(jq '.assets | length' /tmp/rel.json)"
          echo ">> .zip assets:"
          jq -r '.assets[] | select(.name | endswith(".zip")) | "  - " + .name + "  ->  " + .url' /tmp/rel.json

          ZIP_COUNT="$(jq '[.assets[] | select(.name | endswith(".zip"))] | length' /tmp/rel.json)"
          if [ "$ZIP_COUNT" -eq 0 ]; then
            echo "::error::This release has NO .zip assets. Nothing to add."
            exit 1
          fi

          # Stash the list of (name,url) pairs for .zip assets as TSV so the
          # next step can iterate cleanly.
          jq -r '.assets[] | select(.name | endswith(".zip")) | [.name, .url] | @tsv' /tmp/rel.json > /tmp/zips.tsv

          echo "RELEASE_TAG=$REL_TAG" >> "$GITHUB_ENV"

      # ---------- 3. Download all assets + scan each .zip for .exe ----------
      # Bulk-download everything, then iterate over the .zip files only.
      # For each .zip we compute: id, beautified name, version, type,
      # activator flag, sha256, size, link. Results land in /tmp/entries.jsonl
      # (one JSON object per line) for the merge step to consume.
      - name: Scan assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p scan

          echo ">> Bulk-downloading all assets for tag '$RELEASE_TAG'..."
          if ! gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir scan --clobber; then
            echo "::error::Failed to download assets for tag '$RELEASE_TAG'."
            exit 1
          fi
          echo ">> Downloaded files:"
          ls -la scan

          # Output file: one JSON entry per line (JSONL).
          : > /tmp/entries.jsonl

          # Iterate over .zip assets (sorted for stable output).
          while IFS=$'\t' read -r FNAME URL; do
            [ -z "$FNAME" ] && continue
            DEST="scan/$FNAME"
            echo ""
            echo "================ $FNAME ================"

            # ---- Beautify name + extract version from the filename ----
            BASE="${FNAME%.zip}"
            # Strip trailing version: optional sep + optional v + digits(.digits)*
            BASE_NO_VER="$(echo "$BASE" | sed -E 's/[-_. ]?[vV]?[0-9]+(\.[0-9]+)*$//')"
            [ -z "$BASE_NO_VER" ] && BASE_NO_VER="$BASE"
            BEAUTY="$(echo "$BASE_NO_VER" | tr '_.-' '   ' | sed -E 's/  +/ /g' | sed -E 's/^ +//;s/ +$//')"
            [ -z "$BEAUTY" ] && BEAUTY="$BASE"
            # Version = trailing numeric run (digits with dots). Default "1.0".
            VERSION="$(echo "$BASE" | grep -oE '[0-9]+(\.[0-9]+)*' | tail -1 || true)"
            [ -z "$VERSION" ] && VERSION="1.0"
            # ID = slug of the FULL filename (with version) so versions stay unique.
            ID="$(echo -n "$BASE" | tr -c 'a-zA-Z0-9' '-' | sed 's/^-*//;s/-*$//' | tr 'A-Z' 'a-z')"
            [ -z "$ID" ] && ID="entry-$(date -u +%Y%m%d%H%M%S)"

            echo "  name    = $BEAUTY"
            echo "  version = $VERSION"
            echo "  id      = $ID"

            # ---- Unzip + scan for .exe ----
            HAS_EXE=false
            HAS_ACTIVATOR=false
            EXTRACT_DIR="scan/${BASE}"
            mkdir -p "$EXTRACT_DIR"
            if unzip -q "$DEST" -d "$EXTRACT_DIR" 2>/dev/null; then
              EXE_LIST="$(find "$EXTRACT_DIR" -type f -iname '*.exe' 2>/dev/null || true)"
              if [ -n "$EXE_LIST" ]; then
                HAS_EXE=true
                echo "  exe found inside zip:"
                echo "$EXE_LIST" | sed "s#^$EXTRACT_DIR#    - #"
                if echo "$EXE_LIST" | grep -iq '/activator\.exe$'; then
                  HAS_ACTIVATOR=true
                  echo "  -> activator.exe detected"
                fi
              else
                echo "  no .exe inside zip"
              fi
            else
              echo "  (zip could not be extracted — treating as Plugin)"
            fi

            if [ "$HAS_EXE" = true ]; then ENTRY_TYPE="Standalone"; else ENTRY_TYPE="Plugin"; fi
            echo "  type     = $ENTRY_TYPE"
            echo "  activator= $HAS_ACTIVATOR"

            # ---- sha256 + size of the .zip itself ----
            SHA="$(sha256sum "$DEST" | awk '{print $1}')"
            SIZE="$(stat -c %s "$DEST")"
            echo "  sha256   = $SHA"
            echo "  size     = $SIZE"
            echo "  link     = $URL"

            # ---- Emit one JSON entry line ----
            NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            DATE_SHORT="${NOW:0:10}"
            jq -n -c \
              --arg id "$ID" \
              --arg name "$BEAUTY" \
              --arg type "$ENTRY_TYPE" \
              --arg version "$VERSION" \
              --arg last_updated "$DATE_SHORT" \
              --arg link "$URL" \
              --arg sha256 "$SHA" \
              --argjson size_bytes "$SIZE" \
              --argjson activator "$([ "$HAS_ACTIVATOR" = true ] && echo true || echo false)" \
              --arg now "$NOW" \
              '{id:$id, name:$name, category:"plugin", type:$type, version:$version,
                last_updated:$last_updated, link:$link, sha256:$sha256,
                size_bytes:$size_bytes, activator:$activator,
                createdAt:$now, updatedAt:$now}' >> /tmp/entries.jsonl
          done < <(sort /tmp/zips.tsv)

          echo ""
          echo ">> Entries to merge:"
          jq -s '.' /tmp/entries.jsonl

      # ---------- 4. Merge entries into After-Effect-HUB.json ----------
      # For each new entry:
      #   - match existing by id (case-insensitive) OR by link (browser url).
      #     Matching by LINK is what makes manual name edits survive: even if
      #     you renamed "Saber" to "My Saber Plugin" in the JSON, the link is
      #     unchanged so we still find and update the right entry.
      #   - on match: refresh only technical fields (type, activator, sha256,
      #     size_bytes, link, version, last_updated, updatedAt). PRESERVE
      #     name, category, plugin_type, description, tags, createdAt.
      #   - on no match: append the new entry.
      - name: Update After-Effect-HUB.json
        run: |
          set -euo pipefail
          JSON_PATH="After-Effect-HUB.json"
          if [ ! -f "$JSON_PATH" ]; then
            echo ">> After-Effect-HUB.json not found, creating empty array."
            echo "[]" > "$JSON_PATH"
          fi
          if [ ! -s "$JSON_PATH" ]; then echo "[]" > "$JSON_PATH"; fi
          # Normalize single object -> array.
          if ! jq -e 'type == "array"' "$JSON_PATH" >/dev/null 2>&1; then
            jq '[.]' "$JSON_PATH" > /tmp/wrapped.json && mv /tmp/wrapped.json "$JSON_PATH"
          fi

          cp "$JSON_PATH" /tmp/hub.json
          ADDED=0; UPDATED=0

          while IFS= read -r LINE; do
            [ -z "$LINE" ] && continue
            ID="$(echo "$LINE" | jq -r '.id')"
            LINK="$(echo "$LINE" | jq -r '.link')"

            # Find existing index by id (case-insensitive) OR exact link.
            EXISTING_IDX="$(jq --arg id "$ID" --arg link "$LINK" \
              'to_entries | map(select((.value.id|ascii_downcase)==($id|ascii_downcase) or .value.link==$link)) | first | .key // empty' \
              /tmp/hub.json)"

            if [ -n "$EXISTING_IDX" ]; then
              UPDATED=$((UPDATED+1))
              echo ">> UPDATE entry at index $EXISTING_IDX (id=$ID)"
              # Refresh technical fields only; PRESERVE name/category/plugin_type/description/tags/createdAt.
              jq --argjson idx "$EXISTING_IDX" --argjson new "$LINE" \
                '.[$idx] as $e
                 | .[$idx] = ($e
                     + {type: $new.type,
                        activator: $new.activator,
                        sha256: $new.sha256,
                        size_bytes: $new.size_bytes,
                        link: $new.link,
                        version: $new.version,
                        last_updated: $new.last_updated,
                        updatedAt: $new.updatedAt})
                 | if (.[$idx].createdAt // null) == null then .[$idx].createdAt = $new.updatedAt else . end' \
                /tmp/hub.json > /tmp/hub.tmp
              mv /tmp/hub.tmp /tmp/hub.json
            else
              ADDED=$((ADDED+1))
              echo ">> ADD new entry (id=$ID, name=$(echo "$LINE" | jq -r '.name'))"
              jq --argjson new "$LINE" '. + [$new]' /tmp/hub.json > /tmp/hub.tmp && mv /tmp/hub.tmp /tmp/hub.json
            fi
          done < /tmp/entries.jsonl

          # Sort by name (case-insensitive) for a stable, reviewable diff.
          jq 'sort_by(.name | ascii_downcase)' /tmp/hub.json > /tmp/hub.tmp && mv /tmp/hub.tmp /tmp/hub.json

          cp /tmp/hub.json "$JSON_PATH"
          echo ">> Added $ADDED new entry(ies); updated $UPDATED existing entry(ies)."
          echo "----- Resulting After-Effect-HUB.json -----"
          cat "$JSON_PATH"

      # ---------- 5. Commit & push (only if JSON changed) ----------
      - name: Commit updated JSON
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add After-Effect-HUB.json
          if git diff --cached --quiet; then
            echo ">> No changes to After-Effect-HUB.json — nothing to commit."
          else
            git commit -m "chore(hub): add/update entries from release '$RELEASE_TAG'"
            git push
            echo ">> Pushed commit."
          fi
