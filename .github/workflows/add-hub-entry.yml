# Add (or update) a SINGLE entry in After-Effect-HUB.json for one release.
#
# MANUAL ONLY — it never runs automatically. No `on: release`, no `on: push`,
# no `schedule`. You trigger it yourself from the Actions tab after you upload
# a release.
#
# WHY THIS EXISTS (instead of the old full-rebuild build-catalog.yml):
#   The old workflow rebuilt the ENTIRE JSON from scratch on every release
#   event + daily. That overwrote any hand-tweaked entries and could nuke the
#   file if a release was missing. This workflow touches ONLY the entry for
#   the release you specify — everything else is left alone.
#
# INPUTS (from the Actions tab → Run workflow):
#   release_tag   Optional. The tag of the release you just uploaded.
#                 Leave EMPTY to use the most recent published release
#                 (so you don't have to remember the exact tag spelling).
#   entry_id      Optional. Force a specific id slug. If empty, the id is
#                 derived from the release tag (NOT the name — the visible
#                 "name" field is ALWAYS the exact release title).
#
# WHAT IT DOES:
#   1. Resolves the release (by tag, or latest if tag is empty). If the tag
#      doesn't exist it STOPS immediately and lists every available tag so
#      you can see what to type next time.
#   2. Uses the release's EXACT title as the entry's "name" field — no
#      trimming, no slugifying, no case change. Whatever you typed as the
#      release title is what goes into the JSON, character-for-character.
#   3. Downloads each .zip asset, extracts it, recursively scans for any
#      .exe. If at least one .exe is found → type = "Standalone", else
#      "Plugin". Also looks specifically for activator.exe.
#   4. Computes the .zip's sha256 + size_bytes (so the C++ side can verify
#      the download) and records the asset's browser_download_url as "link".
#   5. Adds the entry to After-Effect-HUB.json. If an entry with the same id
#      OR the same exact name already exists, it UPDATES that entry instead
#      of duplicating.
#   6. Commits back to main ONLY if the JSON actually changed.
name: Add HUB Entry

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag of the release to add (leave EMPTY for the latest release)"
        required: false
        type: string
        default: ""
      entry_id:
        description: "Force a specific id slug (optional — defaults to a slug of the tag)"
        required: false
        type: string
        default: ""

permissions:
  contents: write   # needed to commit back to After-Effect-HUB.json

concurrency:
  group: add-hub-entry
  cancel-in-progress: false

jobs:
  add-entry:
    runs-on: windows-latest   # Windows runner: PowerShell + Expand-Archive just work
    steps:
      # ---------- 1. Checkout (full history so we can commit back) ----------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- 2. Resolve the release ----------
      # If release_tag is empty → use the latest published release.
      # If a tag is given but doesn't exist → list every available tag and STOP.
      # We check gh's exit code explicitly so a bad tag can't silently proceed
      # with empty data (the bug that blew up last time).
      - name: Resolve release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Resolve the tag (latest if empty).
          if ([string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            Write-Host "No release_tag given — using the latest published release."
            # `gh release list` returns newest first by default.
            $tag = (gh release list --repo "$env:GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
            if ([string]::IsNullOrWhiteSpace($tag)) {
              Write-Host "::error::This repo has NO published releases. Upload a release first, then run this workflow again."
              exit 1
            }
            Write-Host "Latest release tag: $tag"
          } else {
            $tag = $env:INPUT_TAG.Trim()
            Write-Host "Fetching release for tag: '$tag'"

            # Verify the tag exists BEFORE doing anything else. gh returns a
            # non-zero exit code if the release isn't found — we catch that
            # and list every available tag so the user can see the real ones.
            $relJson = gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" --json name,tagName,assets,url 2>$null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Release with tag '$tag' was NOT FOUND. Here are the tags that DO exist in this repo:"
              Write-Host "----- available release tags -----"
              gh release list --repo "$env:GITHUB_REPOSITORY" --limit 50 --json tagName,name --jq '.[] | "  - " + .tagName + "  (" + .name + ")"'
              Write-Host "---------------------------------"
              Write-Host "Re-run this workflow with one of the tags above (or leave the input empty to use the latest)."
              exit 1
            }
          }

          # Re-fetch the release JSON (covers both the latest-tag branch and
          # the verified-tag branch above) so we have name + assets + url.
          $relJson = gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" --json name,tagName,assets,url
          $relObj  = $relJson | ConvertFrom-Json

          # EXACT release name — no trimming, no slugify, no case change.
          # Only fall back to the tag if the release genuinely has no title.
          $exactName = $relObj.name
          if ([string]::IsNullOrWhiteSpace($exactName)) {
            $exactName = $relObj.tagName
          }

          Write-Host "Using EXACT release name: '$exactName'"
          Write-Host "Tag: $($relObj.tagName)"

          # Stash for later steps via GITHUB_ENV.
          "RELEASE_NAME=$exactName"        | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=$($relObj.tagName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_URL=$($relObj.url)"      | Out-File -FilePath $env:GITHUB_ENV -Append

          # Persist the asset list as a file so the next step can re-read it.
          $relObj.assets | ForEach-Object { $_.browser_download_url } |
            Out-File -FilePath "assets.txt" -Encoding utf8
          Write-Host "Asset URLs:"
          Get-Content assets.txt

      # ---------- 3. Download + scan assets for .exe (inside zips too) ----------
      - name: Detect .exe in release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "scan" | Out-Null

          $hasExe       = $false
          $hasActivator = $false
          $primaryZip   = $null   # first .zip asset — used for sha256/size/link

          $assetUrls = Get-Content assets.txt | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          foreach ($url in $assetUrls) {
            $fname = Split-Path -Leaf $url
            $dest  = Join-Path "scan" $fname
            Write-Host "Downloading $fname ..."
            Invoke-WebRequest -Uri $url -OutFile $dest

            if ($fname -like "*.zip") {
              if (-not $primaryZip) { $primaryZip = $dest }
              $extractDir = Join-Path "scan" ([System.IO.Path]::GetFileNameWithoutExtension($fname))
              New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
              try {
                Expand-Archive -Path $dest -DestinationPath $extractDir -Force
              } catch {
                Write-Host "  (zip could not be extracted: $_)"
                continue
              }
              # Recursive, case-insensitive search for ANY .exe.
              $exeFiles = Get-ChildItem -Path $extractDir -Recurse -Filter "*.exe" -File -ErrorAction SilentlyContinue
              if ($exeFiles) {
                $hasExe = $true
                Write-Host "  Found exe inside zip:"
                $exeFiles | ForEach-Object { Write-Host "    - $($_.FullName.Substring($extractDir.Length))" }
                $act = $exeFiles | Where-Object { $_.Name -ieq "activator.exe" }
                if ($act) { $hasActivator = $true; Write-Host "  -> activator.exe detected" }
              } else {
                Write-Host "  (no .exe inside zip)"
              }
            }
            elseif ($fname -like "*.exe") {
              $hasExe = $true
              Write-Host "  Found exe asset: $fname"
              if ($fname -ieq "activator.exe") { $hasActivator = $true }
            }
          }

          $entryType = if ($hasExe) { "Standalone" } else { "Plugin" }
          Write-Host "Entry type => $entryType  (activator=$hasActivator)"

          "ENTRY_TYPE=$entryType"      | Out-File -FilePath $env:GITHUB_ENV -Append
          "HAS_ACTIVATOR=$hasActivator"| Out-File -FilePath $env:GITHUB_ENV -Append

          # Stash the primary zip path so the next step can hash + size it.
          if ($primaryZip) {
            "PRIMARY_ZIP=$primaryZip" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host "::warning::No .zip asset found on this release — sha256/size/link will be empty in the JSON."
          }

      # ---------- 4. Compute sha256 + size_bytes of the primary .zip ----------
      - name: Hash + size the primary zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = ""; $size = 0; $link = ""
          if ($env:PRIMARY_ZIP -and (Test-Path $env:PRIMARY_ZIP)) {
            $sha = (Get-FileHash -Path $env:PRIMARY_ZIP -Algorithm SHA256).Hash.ToLower()
            $size = (Get-Item $env:PRIMARY_ZIP).Length
            # link = the browser_download_url of that asset (first .zip in assets.txt)
            $link = (Get-Content assets.txt | Where-Object { $_ -like "*.zip" } | Select-Object -First 1)
          }
          Write-Host "sha256 = $sha"
          Write-Host "size   = $size"
          Write-Host "link   = $link"
          "ASSET_SHA256=$sha"   | Out-File -FilePath $env:GITHUB_ENV -Append
          "ASSET_SIZE=$size"    | Out-File -FilePath $env:GITHUB_ENV -Append
          "ASSET_LINK=$link"    | Out-File -FilePath $env:GITHUB_ENV -Append

      # ---------- 5. Add / update the entry in After-Effect-HUB.json ----------
      # Dedup by id OR by exact name (so re-running updates instead of duplicating).
      # The "name" field is the EXACT release title — never modified.
      - name: Update After-Effect-HUB.json
        shell: pwsh
        env:
          ENTRY_ID_OVERRIDE: ${{ github.event.inputs.entry_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $jsonPath = "After-Effect-HUB.json"
          if (-not (Test-Path $jsonPath)) {
            Write-Host "After-Effect-HUB.json not found, creating empty array."
            "[]" | Out-File -FilePath $jsonPath -Encoding utf8NoBOM
          }

          # Read raw, parse as array (handle single-object or empty file).
          $raw  = Get-Content $jsonPath -Raw
          if ([string]::IsNullOrWhiteSpace($raw)) { $raw = "[]" }
          $data = $raw | ConvertFrom-Json
          if ($data -isnot [System.Array]) { $data = @($data) }
          if ($null -eq $data)             { $data = @() }

          $exactName = $env:RELEASE_NAME
          $tag       = $env:RELEASE_TAG
          $url       = $env:RELEASE_URL
          $type      = $env:ENTRY_TYPE
          $activator = ($env:HAS_ACTIVATOR -eq "true")
          $sha       = $env:ASSET_SHA256
          $size      = $env:ASSET_SIZE
          $link      = $env:ASSET_LINK
          $now       = (Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')

          # ID: prefer the explicit override, else slugify the TAG (not the name).
          # The visible "name" stays EXACT — only the internal id is slugified.
          if (-not [string]::IsNullOrWhiteSpace($env:ENTRY_ID_OVERRIDE)) {
            $id = $env:ENTRY_ID_OVERRIDE
          } else {
            $id = $tag -replace '[^a-zA-Z0-9]+','-' -replace '^-+','' -replace '-+$','' -tolower
            if ([string]::IsNullOrWhiteSpace($id)) {
              $id = "entry-" + (Get-Date -Format 'yyyyMMddHHmmss')
            }
          }

          # Find existing entry by id OR by exact name (so re-runs UPDATE,
          # never duplicate). -ceq = case-sensitive exact match on the name.
          $existing = $null
          foreach ($e in $data) {
            if ($e.id -ieq $id)            { $existing = $e; break }
            if ($e.name -ceq $exactName)   { $existing = $e; break }
          }

          if ($existing) {
            Write-Host "Updating existing entry: id=$($existing.id)"
            $existing.name        = $exactName
            $existing.type        = $type
            $existing.version     = $tag
            $existing.link        = $link
            $existing.sha256      = $sha
            $existing.size_bytes  = $size
            $existing.activator   = $activator
            $existing.last_updated = $now.Substring(0,10)
            $existing.updatedAt   = $now
            if (-not ($existing.PSObject.Properties.Name -contains 'createdAt')) {
              $existing | Add-Member -NotePropertyName createdAt -NotePropertyValue $now
            }
          } else {
            Write-Host "Adding NEW entry with id: $id"
            # Build an ordered hashtable so the JSON fields come out in a
            # readable order. ConvertTo-Json preserves insertion order on
            # [ordered] hashtables.
            $newEntry = [ordered]@{
              id           = $id
              name         = $exactName         # <-- EXACT release title
              category     = "plugin"
              type         = $type              # "Standalone" or "Plugin"
              version      = $tag
              last_updated = $now.Substring(0,10)
              link         = $link
              sha256       = $sha
              size_bytes   = $size
              activator    = $activator
              createdAt    = $now
              updatedAt    = $now
            }
            $data = @($data) + $newEntry
          }

          # Sort entries by name (case-insensitive) for a stable, reviewable
          # diff — same convention as the old build_catalog.py.
          $data = @($data | Sort-Object { $_.name })

          # Write back with UTF-8 no-BOM and 2-space indentation.
          ($data | ConvertTo-Json -Depth 8) | Out-File -FilePath $jsonPath -Encoding utf8NoBOM
          Write-Host "----- Resulting After-Effect-HUB.json -----"
          Get-Content $jsonPath

      # ---------- 6. Commit & push (only if JSON changed) ----------
      - name: Commit updated JSON
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add After-Effect-HUB.json
          $status = git status --porcelain
          if ([string]::IsNullOrWhiteSpace($status)) {
            Write-Host "No changes to After-Effect-HUB.json — nothing to commit."
          } else {
            git commit -m "chore(hub): add/update entry '$env:RELEASE_NAME' (tag=$env:RELEASE_TAG, type=$env:ENTRY_TYPE)"
            git push
            Write-Host "Pushed commit."
          }
