name: Add After-Effect-HUB Entry

# ============================================================
#  This workflow is MANUAL ONLY.
#  It does NOT run on release, push, schedule, or anything else.
#  You trigger it yourself from the Actions tab after uploading a release.
#  When you trigger it, you paste the tag of the release you just uploaded.
# ============================================================
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag of the release you just uploaded (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write   # needed to commit back to After-Effect-HUB.json

jobs:
  add-entry:
    runs-on: windows-latest   # Windows runner so PowerShell + Expand-Archive just work
    steps:
      # ---------- 1. Checkout (full history so we can commit back) ----------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- 2. Read the release you specified ----------
      - name: Get release info
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.event.inputs.release_tag }}"
          Write-Host "Fetching release for tag: $tag"

          # Get release JSON via gh CLI
          $rel = gh release view "$tag" --json name,tagName,assets,url --repo "$env:GITHUB_REPOSITORY"
          $relObj = $rel | ConvertFrom-Json

          # EXACT release name - no trimming, no slugify, no case change.
          $exactName = $relObj.name
          if ([string]::IsNullOrWhiteSpace($exactName)) {
            # If you didn't give the release a title, fall back to the tag, untouched.
            $exactName = $relObj.tagName
          }

          Write-Host "Using EXACT release name: '$exactName'"

          # Stash for later steps
          "RELEASE_NAME=$exactName"            | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=$($relObj.tagName)"      | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_URL=$($relObj.url)"          | Out-File -FilePath $env:GITHUB_ENV -Append

          # Build the asset list as a PowerShell array we can reuse
          $assets = $relObj.assets | ForEach-Object { $_.browser_download_url }
          $assets -join "`n" | Out-File -FilePath "assets.txt" -Encoding utf8
          Write-Host "Asset URLs:"
          Get-Content assets.txt

      # ---------- 3. Download every asset, look for an .exe (incl. inside zips) ----------
      - name: Detect .exe in release assets
        id: detect
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "scan" | Out-Null

          $hasExe = $false
          $hasActivator = $false
          $assetUrls = Get-Content assets.txt

          foreach ($url in $assetUrls) {
            if ([string]::IsNullOrWhiteSpace($url)) { continue }
            $fname = Split-Path -Leaf $url
            $dest  = Join-Path "scan" $fname
            Write-Host "Downloading $fname ..."
            Invoke-WebRequest -Uri $url -OutFile $dest

            if ($fname -like "*.zip") {
              $extractDir = Join-Path "scan" ([System.IO.Path]::GetFileNameWithoutExtension($fname))
              New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
              try {
                Expand-Archive -Path $dest -DestinationPath $extractDir -Force
              } catch {
                Write-Host "  (zip could not be extracted: $_)"
                continue
              }
              # Recursive, case-insensitive search for ANY .exe
              $exeFiles = Get-ChildItem -Path $extractDir -Recurse -Filter "*.exe" -File
              if ($exeFiles) {
                $hasExe = $true
                Write-Host "  Found exe inside zip:"
                $exeFiles | ForEach-Object { Write-Host "    - $($_.FullName)" }
                # Look specifically for activator.exe (case-insensitive)
                $act = $exeFiles | Where-Object { $_.Name -ieq "activator.exe" }
                if ($act) { $hasActivator = $true; Write-Host "  -> activator.exe detected" }
              }
            }
            elseif ($fname -like "*.exe") {
              $hasExe = $true
              Write-Host "  Found exe asset: $fname"
              if ($fname -ieq "activator.exe") { $hasActivator = $true }
            }
          }

          $entryType = if ($hasExe) { "Standalone" } else { "Plugin" }
          Write-Host "Entry type => $entryType  (activator=$hasActivator)"

          "ENTRY_TYPE=$entryType"          | Out-File -FilePath $env:GITHUB_ENV -Append
          "HAS_ACTIVATOR=$hasActivator"    | Out-File -FilePath $env:GITHUB_ENV -Append

      # ---------- 4. Add / update the entry in After-Effect-HUB.json ----------
      - name: Update After-Effect-HUB.json
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jsonPath = "After-Effect-HUB.json"
          if (-not (Test-Path $jsonPath)) {
            Write-Host "After-Effect-HUB.json not found, creating empty array."
            "[]" | Out-File -FilePath $jsonPath -Encoding utf8
          }

          # Read as raw text so we keep formatting under control, then parse.
          $raw = Get-Content $jsonPath -Raw
          $data = $raw | ConvertFrom-Json

          # Make sure $data is an array even if file held a single object.
          if ($data -isnot [System.Array]) {
            $data = @($data)
          }

          $exactName = $env:RELEASE_NAME
          $tag       = $env:RELEASE_TAG
          $url       = $env:RELEASE_URL
          $type      = $env:ENTRY_TYPE
          $activator = ($env:HAS_ACTIVATOR -eq "true")

          # ID = sanitized version of the tag (NOT of the name) — only the ID is slugified,
          # the visible "name" field stays EXACTLY what you typed in the release.
          $id = $tag -replace '[^a-zA-Z0-9]+','-' -replace '^-+','' -replace '-+$','' -tolower
          if ([string]::IsNullOrWhiteSpace($id)) { $id = "entry-$(Get-Date -Format 'yyyyMMddHHmmss')" }

          # Find existing entry by id OR by exact name (so re-running updates instead of duplicating)
          $existing = $null
          foreach ($e in $data) {
            if ($e.id -ieq $id) { $existing = $e; break }
            if ($e.name -ceq $exactName) { $existing = $e; break }
          }

          if ($existing) {
            Write-Host "Updating existing entry: $($existing.id)"
            $existing.name       = $exactName
            $existing.type       = $type
            $existing.tag        = $tag
            $existing.url        = $url
            $existing.activator  = $activator
            $existing.updatedAt  = (Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')
            if (-not $existing.PSObject.Properties.Name -contains 'createdAt') {
              $existing | Add-Member -NotePropertyName createdAt -NotePropertyValue (Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')
            }
          } else {
            Write-Host "Adding new entry with id: $id"
            $newEntry = [ordered]@{
              id        = $id
              name      = $exactName          # <-- EXACT release name, untouched
              type      = $type
              tag       = $tag
              url       = $url
              activator = $activator
              createdAt = (Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')
              updatedAt = (Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')
            }
            $data = @($data) + $newEntry
          }

          # Write back with UTF-8 no-BOM and indented formatting
          ($data | ConvertTo-Json -Depth 8) | Out-File -FilePath $jsonPath -Encoding utf8NoBOM
          Write-Host "----- Resulting JSON -----"
          Get-Content $jsonPath

      # ---------- 5. Commit & push ----------
      - name: Commit updated JSON
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add After-Effect-HUB.json
          $status = git status --porcelain
          if ([string]::IsNullOrWhiteSpace($status)) {
            Write-Host "No changes to After-Effect-HUB.json — nothing to commit."
          } else {
            git commit -m "chore(hub): add/update entry for $env:RELEASE_TAG (name='$env:RELEASE_NAME', type=$env:ENTRY_TYPE)"
            git push
            Write-Host "Pushed commit."
          }
